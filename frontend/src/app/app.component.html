<app-three-background></app-three-background>
<div [@routeAnimations]="prepareRoute(outlet)" style="position: relative; min-height: 100vh;">
  <router-outlet #outlet="outlet"></router-outlet>
</div>

<!-- Global Notification Drawer Overlay -->
<div *ngIf="sidebarService.isNotificationVisible" 
     (click)="sidebarService.toggleNotifications()" 
     style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.3);z-index:9998;transition:opacity 0.2s ease;">
</div>

<div *ngIf="sidebarService.isNotificationVisible" 
     style="position:fixed;top:0;right:0;width:380px;height:100vh;background:white;box-shadow:-4px 0 15px rgba(0,0,0,0.1);z-index:9999;display:flex;flex-direction:column;padding:1.5rem;">
  
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;border-bottom:2px solid #f1f5f9;padding-bottom:0.75rem;">
    <h3 style="margin:0;color:#1e293b;font-weight:800;font-size:1.15rem;">🔔 Notifications Panel</h3>
    <button (click)="sidebarService.toggleNotifications()" 
            style="background:none;border:none;font-size:1.25rem;cursor:pointer;color:#64748b;font-weight:700;">✕</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:1rem;flex:1;overflow-y:auto;">
    <div *ngFor="let n of (sidebarService.notifications$ | async)" 
         (click)="n.status === 'Unread' ? sidebarService.markAsRead(n.id) : null"
         [style.background]="n.status === 'Unread' ? '#e0f2fe' : '#f8fafc'"
         [style.cursor]="n.status === 'Unread' ? 'pointer' : 'default'"
         style="border:1px solid #e2e8f0;padding:1rem;border-radius:6px;display:flex;flex-direction:column;gap:0.25rem;">
      <div style="font-weight:800;font-size:0.85rem;color:#1e293b;">
        {{n.title || 'Notification'}}
        <span *ngIf="n.status === 'Unread'" style="background:#ef4444;color:white;padding:2px 6px;border-radius:10px;font-size:0.6rem;margin-left:5px;">New</span>
      </div>
      <div style="font-size:0.85rem;color:#475569;line-height:1.4;font-weight:500;">{{n.message}}</div>
      <div style="font-size:0.75rem;color:#94a3b8;align-self:flex-end;margin-top:0.25rem;font-weight:600;">{{n.time}}</div>
    </div>
  </div>
</div>
