<div class="dashboard-container">
  <div class="header">
    <h1>Admin Overview</h1>
    <p>Welcome back! Here is a summary of the Vendor Reliability Platform.</p>
  </div>

  <div class="metrics-grid">
    <mat-card *ngFor="let metric of metrics" class="metric-card">
      <mat-card-content>
        <div class="metric-content">
          <div class="metric-info">
            <div class="metric-title">{{metric.title}}</div>
            <div class="metric-value" [style.color]="metric.color">{{metric.value}}</div>
          </div>
          <div class="metric-icon" [style.background-color]="metric.color + '20'" [style.color]="metric.color">
            <mat-icon>{{metric.icon}}</mat-icon>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="main-content-grid">
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Vendor Performance Analytics</mat-card-title>
      </mat-card-header>
      <mat-card-content class="placeholder-chart">
        <mat-icon>bar_chart</mat-icon>
        <p>Awaiting UI/UX finalized charts here.</p>
      </mat-card-content>
    </mat-card>

    <mat-card class="activity-card">
      <mat-card-header>
        <mat-card-title>Recent Activity</mat-card-title>
      </mat-card-header>
      <mat-divider></mat-divider>
      <mat-card-content>
        <div class="activity-list">
          <div class="activity-item" *ngFor="let activity of recentActivities">
            <mat-icon color="primary" class="activity-icon">circle</mat-icon>
            <div class="activity-text">
              <span class="message">{{activity.message}}</span>
              <span class="time">{{activity.time}}</span>
            </div>
          </div>
        </div>
      </mat-card-content>
      <mat-divider></mat-divider>
      <mat-card-actions>
        <button mat-button color="primary">View All Notifications</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
