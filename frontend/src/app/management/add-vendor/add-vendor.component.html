<div class="dash-wrapper" [class.sidebar-hidden]="!sidebarService.isSidebarVisible">
  <app-sidebar></app-sidebar>
  <div class="dash-main">
    <!-- Top Navbar -->
    <div class="dash-topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger-btn" (click)="sidebarService.toggleSidebar()">☰</button>
        <button (click)="goBack()" style="background:#e2e8f0;border:none;padding:0.4rem 0.8rem;border-radius:4px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.25rem;font-size:0.85rem;">
          ← Go Back
        </button>
        <span class="dash-topbar-title">Vendor Reliability Platform</span>
      </div>
      <div class="dash-topbar-right">
        <span>🔔 Notifications</span>
        <span class="dash-topbar-user">👤 {{ sidebarService.getCurrentRoleLabel() }}</span>
      </div>
    </div>
    
    <div class="dash-content" style="background:#d1d5db;">
  <div style="padding:2rem;max-width:1400px;margin:0 auto;">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <h2 style="margin:0;font-weight:800;">Add New Vendor</h2>
      <p style="margin:0;font-weight:700;">Register and Manage Vendor Information</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2rem;">
      <!-- Column 1 -->
      <div>
        <h4 style="font-weight:800;margin-bottom:1rem;">Company Information</h4>
        <div style="margin-bottom:0.75rem;">
          <label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Company Name *</label>
          <input type="text" placeholder="Enter company name" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;">
        </div>
        <div style="margin-bottom:1.5rem;">
          <label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Vendor Category *</label>
          <select style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;">
            <option value="" disabled selected>Select Category</option>
            <option *ngFor="let c of categories">{{c}}</option>
          </select>
        </div>
        <h4 style="font-weight:800;margin-bottom:1rem;">Contact Information</h4>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Contact Person *</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Email Address *</label><input type="email" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Phone Number *</label><input type="tel" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Designation</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Alternate Phone</label><input type="tel" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
      </div>
      <!-- Column 2 -->
      <div>
        <h4 style="font-weight:800;margin-bottom:1rem;">Business Information</h4>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">GST Number</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">PAN Number</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:1.5rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Company Registration Number</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <h4 style="font-weight:800;margin-bottom:1rem;">Banking Information</h4>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Bank Account Number</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;">
          <label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Payment Terms ▼</label>
          <select style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"><option *ngFor="let pt of paymentTerms">{{pt}}</option></select>
        </div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">IFSC Code</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;">
          <label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Vendor Status ▼</label>
          <select style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"><option *ngFor="let s of statusOptions">{{s}}</option></select>
        </div>
      </div>
      <!-- Column 3 -->
      <div>
        <h4 style="font-weight:800;margin-bottom:1rem;">Address</h4>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Address Line 1</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Address Line 2</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0.5rem;margin-bottom:0.75rem;">
          <div><label style="display:block;font-size:0.8rem;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">City</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
          <div><label style="display:block;font-size:0.8rem;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">State</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
          <div><label style="display:block;font-size:0.8rem;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Country</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
          <div><label style="display:block;font-size:0.8rem;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Pincode</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        </div>
        <div style="margin-bottom:0.75rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Website</label><input type="url" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <div style="margin-bottom:1.5rem;"><label style="display:block;font-weight:600;color:#6b7280;margin-bottom:0.3rem;">Description</label><input type="text" style="width:100%;padding:0.6rem;border:none;background:white;border-radius:4px;"></div>
        <h4 style="font-weight:800;margin-bottom:1rem;">Upload Vendor Documents</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem;">
          <button style="padding:0.75rem;background:#2563eb;color:white;border:none;border-radius:4px;font-weight:700;cursor:pointer;">GST Cert. Upload ⬆️</button>
          <button style="padding:0.75rem;background:#2563eb;color:white;border:none;border-radius:4px;font-weight:700;cursor:pointer;">ISO Cert Upload ⬆️</button>
          <button style="padding:0.75rem;background:#2563eb;color:white;border:none;border-radius:4px;font-weight:700;cursor:pointer;">PAN Card Upload ⬆️</button>
          <button style="padding:0.75rem;background:#2563eb;color:white;border:none;border-radius:4px;font-weight:700;cursor:pointer;">Company Reg Upload ⬆️</button>
          <button style="padding:0.75rem;background:#2563eb;color:white;border:none;border-radius:4px;font-weight:700;cursor:pointer;grid-column:span 1;">Other Docs Upload ⬆️</button>
        </div>
        <div style="display:flex;gap:1rem;">
          <button routerLink="/vendors" style="flex:1;padding:0.85rem;background:#8b5cf6;color:white;border:none;border-radius:4px;font-weight:700;font-size:1rem;cursor:pointer;">Save Vendor</button>
          <button routerLink="/vendors" style="flex:1;padding:0.85rem;background:#8b5cf6;color:white;border:none;border-radius:4px;font-weight:700;font-size:1rem;cursor:pointer;">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</div>
