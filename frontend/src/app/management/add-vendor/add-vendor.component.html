<div class="header-strip">Vendor Reliability Platform</div>
<div class="subheader-strip">
  <div style="display:flex;align-items:center;gap:1rem;">
    <button class="hamburger-btn" (click)="sidebarService.toggleSidebar()">☰</button>
  </div>
  <div class="topbar-right-info">
    <span class="bell-span" (click)="sidebarService.toggleNotifications()">🔔 Notifications</span>
    <span class="user-span">👤 Administrator</span>
  </div>
</div>

<div class="dash-wrapper" [class.sidebar-hidden]="!sidebarService.isSidebarVisible">
  <app-sidebar></app-sidebar>
  <div class="dash-main">
    <div class="dash-content">
      
      <div class="add-vendor-header">
        <h2>Add New Vendor</h2>
        <p>Register and Manage Vendor Information</p>
      </div>

      <div *ngIf="errorMessage" style="margin-bottom: 1.5rem; padding: 1rem; background: #fee2e2; color: #991b1b; border-left: 5px solid #ef4444; border-radius: 6px; font-weight: 600;">
        ⚠️ {{ errorMessage }}
      </div>

      <div class="add-vendor-grid">
        
        <!-- Column 1 -->
        <div class="form-col">
          <div class="form-section-title">Company Information</div>
          <div class="field-group">
            <label class="field-label">Company Name *</label>
            <input type="text" [(ngModel)]="vendorForm.companyName" placeholder="Enter company name" class="field-input" required>
          </div>
          <div class="field-group" style="margin-bottom:1.5rem;">
            <label class="field-label">Vendor Category *</label>
            <select [(ngModel)]="vendorForm.vendorCategory" class="field-select" required>
              <option value="" disabled>Select Category</option>
              <option *ngFor="let c of categories" [value]="c">{{c}}</option>
            </select>
          </div>

          <div class="form-section-title">Contact Information</div>
          <div class="field-group">
            <label class="field-label">Contact Person *</label>
            <input type="text" [(ngModel)]="vendorForm.contactPerson" class="field-input" required>
          </div>
          <div class="field-group">
            <label class="field-label">Email Address *</label>
            <input type="email" [(ngModel)]="vendorForm.email" class="field-input" required>
          </div>
          <div class="field-group">
            <label class="field-label">Phone Number *</label>
            <input type="tel" [(ngModel)]="vendorForm.phone" class="field-input" required>
          </div>
          <div class="field-group">
            <label class="field-label">Designation</label>
            <input type="text" [(ngModel)]="vendorForm.designation" class="field-input">
          </div>
          <div class="field-group">
            <label class="field-label">Alternate Phone</label>
            <input type="tel" [(ngModel)]="vendorForm.alternatePhone" class="field-input">
          </div>
        </div>

        <!-- Column 2 -->
        <div class="form-col">
          <div class="form-section-title">Business Information</div>
          <div class="field-group">
            <label class="field-label">GST Number</label>
            <input type="text" [(ngModel)]="vendorForm.gstNumber" class="field-input">
          </div>
          <div class="field-group">
            <label class="field-label">PAN Number</label>
            <input type="text" [(ngModel)]="vendorForm.panNumber" class="field-input">
          </div>
          <div class="field-group" style="margin-bottom:1.5rem;">
            <label class="field-label">Company Registration Number</label>
            <input type="text" [(ngModel)]="vendorForm.companyRegistrationNumber" class="field-input">
          </div>

          <div class="form-section-title">Banking Information</div>
          <div class="field-group">
            <label class="field-label">Bank Account Number</label>
            <input type="text" [(ngModel)]="vendorForm.bankAccountNumber" class="field-input">
          </div>
          <div class="field-group">
            <label class="field-label">Payment Terms ▼</label>
            <select [(ngModel)]="vendorForm.paymentTerms" class="field-select">
              <option *ngFor="let pt of paymentTerms" [value]="pt">{{pt}}</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">IFSC Code</label>
            <input type="text" [(ngModel)]="vendorForm.ifscCode" class="field-input">
          </div>
          <div class="field-group">
            <label class="field-label">Vendor Status ▼</label>
            <select [(ngModel)]="vendorForm.vendorStatus" class="field-select">
              <option *ngFor="let s of statusOptions" [value]="s">{{s}}</option>
            </select>
          </div>
        </div>

        <!-- Column 3 -->
        <div class="form-col">
          <div class="form-section-title">Address</div>
          <div class="field-group">
            <label class="field-label">Address Line 1</label>
            <input type="text" [(ngModel)]="vendorForm.addressLine1" class="field-input">
          </div>
          <div class="field-group">
            <label class="field-label">Address Line 2</label>
            <input type="text" [(ngModel)]="vendorForm.addressLine2" class="field-input">
          </div>
          <div class="address-sub-grid">
            <div class="field-group">
              <label class="field-label">City</label>
              <input type="text" [(ngModel)]="vendorForm.city" class="field-input">
            </div>
            <div class="field-group">
              <label class="field-label">State</label>
              <input type="text" [(ngModel)]="vendorForm.state" class="field-input">
            </div>
            <div class="field-group">
              <label class="field-label">Country</label>
              <input type="text" [(ngModel)]="vendorForm.country" class="field-input">
            </div>
            <div class="field-group">
              <label class="field-label">Pincode</label>
              <input type="text" [(ngModel)]="vendorForm.pincode" class="field-input">
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Website</label>
            <input type="url" [(ngModel)]="vendorForm.website" class="field-input">
          </div>
          <div class="field-group" style="margin-bottom:1.5rem;">
            <label class="field-label">Description</label>
            <input type="text" [(ngModel)]="vendorForm.description" class="field-input">
          </div>

          <div class="form-section-title">Upload Vendor Documents</div>
          <div class="docs-upload-grid">
            <button class="btn-upload">GST Cert. Upload ⬆️</button>
            <button class="btn-upload">ISO Cert Upload ⬆️</button>
            <button class="btn-upload">PAN Card Upload ⬆️</button>
            <button class="btn-upload">Company Reg Upload ⬆️</button>
            <button class="btn-upload" style="grid-column: span 2;">Other Docs Upload ⬆️</button>
          </div>

          <div class="actions-row">
            <button type="button" (click)="onSaveVendor()" class="btn-save">Save Vendor</button>
            <button type="button" (click)="goBack()" class="btn-cancel">Cancel</button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
