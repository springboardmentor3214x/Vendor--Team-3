<div class="dash-wrapper" [class.sidebar-hidden]="!sidebarService.isSidebarVisible">
  <app-sidebar></app-sidebar>
  <div class="dash-main">
    <!-- Top Navbar -->
    <div class="dash-topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger-btn" (click)="sidebarService.toggleSidebar()">☰</button>
        <button (click)="goBack()" style="background:#e2e8f0;border:none;padding:0.4rem 0.8rem;border-radius:4px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.25rem;font-size:0.85rem;">
          ← Go Back
        </button>
        <span class="dash-topbar-title">Reports & Data Export</span>
      </div>
      <div class="dash-topbar-right">
        <span>🔔 Notifications</span>
        <span class="dash-topbar-user">👤 {{ sidebarService.getCurrentRoleLabel() }}</span>
      </div>
    </div>

    <!-- Select Report Controls -->
    <div style="background:#f1f5f9;padding:1.5rem 2rem;border-bottom:1px solid #cbd5e1;display:flex;justify-content:space-between;align-items:center;gap:2rem;">
      <div style="display:flex;align-items:center;gap:1.5rem;">
        <div>
          <label style="display:block;font-size:0.8rem;font-weight:700;color:#475569;margin-bottom:0.25rem;">Select Report Module</label>
          <select [(ngModel)]="selectedReport" (change)="generateReport()" style="padding:0.5rem 1rem;border:1px solid #cbd5e1;border-radius:4px;background:white;font-weight:700;font-size:0.9rem;cursor:pointer;">
            <option value="Performance">Vendor Performance Report</option>
            <option value="Procurement">Procurement & Budget Report</option>
            <option value="Purchase Orders">Purchase Orders (PO) Report</option>
            <option value="Compliance">Compliance & Auditing Check Report</option>
            <option value="Contracts">Active Contracts & Expiry Report</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:1rem;">
        <button (click)="exportToExcel()" style="background:#166534;color:white;border:none;padding:0.6rem 1.2rem;border-radius:4px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:0.25rem;">
          📥 Excel Export
        </button>
        <button (click)="exportToPDF()" style="background:#ef4444;color:white;border:none;padding:0.6rem 1.2rem;border-radius:4px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:0.25rem;">
          🖨️ PDF Print
        </button>
      </div>
    </div>

    <!-- Reports Table -->
    <div style="padding:2rem;">
      <h3 style="margin-top:0;margin-bottom:1rem;color:#1e293b;font-weight:800;">Generated {{selectedReport}} Report Details</h3>
      <table style="width:100%;border-collapse:collapse;box-shadow:0 2px 8px rgba(0,0,0,0.05);border-radius:6px;overflow:hidden;">
        <thead>
          <tr style="background:#475569;color:white;">
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Reference ID</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Partner / Title</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Metric Category</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Registered Value</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Report Date</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of reportData" style="background:white;border-bottom:1px solid #cbd5e1;">
            <td style="padding:1rem;text-align:center;font-weight:700;color:#1e293b;">{{row.id}}</td>
            <td style="padding:1rem;text-align:center;font-weight:700;color:#1e293b;">{{row.name}}</td>
            <td style="padding:1rem;text-align:center;color:#64748b;font-weight:700;">{{row.type}}</td>
            <td style="padding:1rem;text-align:center;color:#1e3a8a;font-weight:700;">{{row.value}}</td>
            <td style="padding:1rem;text-align:center;color:#475569;font-weight:500;">{{row.date}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
