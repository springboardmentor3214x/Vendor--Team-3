<div class="header-strip">Vendor Reliability Platform</div>
<div class="subheader-strip">
  <div style="display:flex;align-items:center;gap:1.5rem;">
    <button class="hamburger-btn" (click)="sidebarService.toggleSidebar()">☰</button>
    <div class="search-box-container">
      <input type="text" [(ngModel)]="searchTerm" placeholder="Search Vendor..." class="search-pill">
    </div>
    <button (click)="loadVendors()" class="refresh-btn">🔄 Refresh</button>
  </div>
  <div class="topbar-right-info">
    <select [(ngModel)]="selectedCategory" class="filter-select">
      <option value="">Category ▼</option>
      <option>Raw Material</option>
      <option>Logistics</option>
      <option>IT Vendor</option>
    </select>
    <select [(ngModel)]="selectedStatus" class="filter-select">
      <option value="">Status ▼</option>
      <option>Active</option>
      <option>Pending</option>
      <option>Suspended</option>
    </select>
    <a routerLink="/add-vendor" class="add-vendor-link">+ Add Vendor</a>
  </div>
</div>

<div class="dash-wrapper" [class.sidebar-hidden]="!sidebarService.isSidebarVisible">
  <app-sidebar></app-sidebar>
  <div class="dash-main">
    <div class="dash-content">
      
      <!-- Vendor Table -->
      <div style="background:white;padding:1.5rem;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.02);border:1px solid #cbd5e1;">
        <table class="vrp-table">
          <thead>
            <tr>
              <th>Vendor ID</th>
              <th>Company Name</th>
              <th>Category</th>
              <th>Contact</th>
              <th>Email</th>
              <th>Status</th>
              <th>Approval</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody *ngIf="isLoading">
            <tr *ngFor="let dummy of [1,2,3,4]">
              <td><div class="shimmer shimmer-text" style="width: 50px; height: 14px;"></div></td>
              <td><div class="shimmer shimmer-text" style="width: 130px; height: 14px;"></div></td>
              <td><div class="shimmer shimmer-text" style="width: 90px; height: 14px;"></div></td>
              <td><div class="shimmer shimmer-text" style="width: 100px; height: 14px;"></div></td>
              <td><div class="shimmer shimmer-text" style="width: 140px; height: 14px;"></div></td>
              <td><div class="shimmer shimmer-text" style="width: 70px; height: 14px;"></div></td>
              <td><div class="shimmer shimmer-text" style="width: 70px; height: 14px;"></div></td>
              <td>
                <div class="shimmer shimmer-text" style="width: 60px; height: 14px;"></div>
              </td>
            </tr>
          </tbody>
          <tbody *ngIf="!isLoading">
            <tr *ngFor="let v of vendors">
              <td style="font-weight:700;">{{ v.id }}</td>
              <td style="font-weight:700;">{{ v.name }}</td>
              <td style="font-weight:700;text-align:left;padding-left:1.5rem;">
                <span class="category-dot" [class.green]="v.category === 'Raw Material'" [class.yellow]="v.category === 'Logistics'" [class.blue]="v.category === 'IT Vendor'"></span>
                {{ v.category }}
              </td>
              <td>{{ v.contact }}</td>
              <td>{{ v.email }}</td>
              <td style="font-weight:700;">{{ v.status }}</td>
              <td style="font-weight:700;">{{ v.approval }}</td>
              <td>
                <a routerLink="/vendor-details" style="text-decoration:none;margin-right:0.5rem;cursor:pointer;">👁️</a>
                <a href="#" (click)="$event.preventDefault()" style="text-decoration:none;margin-right:0.5rem;">✏️</a>
                <a href="#" (click)="$event.preventDefault()" style="text-decoration:none;">🗑️</a>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination-container">
          <span class="showing-text">Showing 1–10 of {{ totalVendors }} Vendors</span>
          <div class="pagination-actions">
            <button (click)="prev()" class="page-arrow">◀ Previous</button>
            <span *ngFor="let p of pages">
              <button (click)="goToPage(p)" class="page-num" [class.active-num]="currentPage === p">{{ p }}</button>
            </span>
            <span style="font-weight:800;color:#64748b;">...</span>
            <button (click)="next()" class="page-arrow">Next ▶</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
