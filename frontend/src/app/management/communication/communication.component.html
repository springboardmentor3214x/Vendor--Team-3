<div class="dash-wrapper" [class.sidebar-hidden]="!sidebarService.isSidebarVisible">
  <app-sidebar></app-sidebar>
  <div class="dash-main">
    <!-- Top Navbar -->
    <div class="dash-topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger-btn" (click)="sidebarService.toggleSidebar()">☰</button>
        <button (click)="goBack()" style="background:#e2e8f0;border:none;padding:0.4rem 0.8rem;border-radius:4px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.25rem;font-size:0.85rem;">
          ← Go Back
        </button>
        <span class="dash-topbar-title">Communication Module</span>
      </div>
      <div class="dash-topbar-right">
        <span>🔔 Notifications</span>
        <span class="dash-topbar-user">👤 {{ sidebarService.getCurrentRoleLabel() }}</span>
      </div>
    </div>

    <!-- Chat Box -->
    <div style="padding:2rem;display:flex;flex-direction:column;gap:1rem;height:calc(100vh - 120px);">
      <h3 style="margin-top:0;margin-bottom:0.5rem;color:#1e293b;font-weight:800;">💬 Vendor & Procurement Discussions</h3>
      
      <!-- Messages Thread Area -->
      <div style="flex:1;background:white;border:1px solid #cbd5e1;border-radius:8px;padding:1.5rem;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;box-shadow:inset 0 2px 4px rgba(0,0,0,0.02);">
        <div *ngFor="let msg of messages" style="display:flex;flex-direction:column;max-width:70%;padding:0.75rem 1rem;border-radius:8px;"
             [style.alignSelf]="msg.sender.includes('TEST') || msg.roleLabel === sidebarService.getCurrentRoleLabel() ? 'flex-end' : 'flex-start'"
             [style.background]="msg.sender.includes('TEST') || msg.roleLabel === sidebarService.getCurrentRoleLabel() ? '#dbeafe' : '#f1f5f9'"
             [style.border]="msg.sender.includes('TEST') || msg.roleLabel === sidebarService.getCurrentRoleLabel() ? '1px solid #bfdbfe' : '1px solid #e2e8f0'">
          <div style="display:flex;justify-content:space-between;gap:1.5rem;margin-bottom:0.25rem;">
            <span style="font-weight:800;font-size:0.8rem;color:#1e293b;">{{msg.sender}} ({{msg.roleLabel}})</span>
            <span style="font-size:0.75rem;color:#64748b;font-weight:600;">{{msg.timestamp}}</span>
          </div>
          <div style="font-size:0.9rem;color:#334155;font-weight:500;line-height:1.4;word-break:break-word;">
            {{msg.text}}
          </div>
          <div *ngIf="msg.fileName" style="margin-top:0.5rem;background:white;border:1px solid #cbd5e1;padding:0.4rem;border-radius:4px;display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;font-weight:700;">
            📎 {{msg.fileName}} <span style="color:#2563eb;cursor:pointer;" title="Download Mock File">⬇️ Download</span>
          </div>
        </div>
      </div>

      <!-- Attachment details -->
      <div *ngIf="selectedFileName" style="background:#fef9c3;border:1px solid #fef08a;padding:0.5rem 1rem;border-radius:4px;font-size:0.85rem;font-weight:700;color:#854d0e;">
        📎 Ready to send: {{selectedFileName}}
      </div>

      <!-- Input Actions -->
      <div style="display:flex;gap:1rem;align-items:center;">
        <input type="text" [(ngModel)]="newMessage" placeholder="Type your message here..." (keyup.enter)="sendMessage()"
               style="flex:1;padding:0.75rem 1rem;border:1px solid #cbd5e1;border-radius:6px;outline:none;font-size:0.95rem;">
        <button (click)="simulateAttach()" style="background:#64748b;color:white;border:none;padding:0.75rem 1.2rem;border-radius:6px;font-weight:700;cursor:pointer;">
          📎 Attach
        </button>
        <button (click)="sendMessage()" style="background:#2563eb;color:white;border:none;padding:0.75rem 1.5rem;border-radius:6px;font-weight:700;cursor:pointer;">
          Send Message
        </button>
      </div>
    </div>
  </div>
</div>
