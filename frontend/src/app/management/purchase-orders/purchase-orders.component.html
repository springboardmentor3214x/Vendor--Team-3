<div class="dash-wrapper" [class.sidebar-hidden]="!sidebarService.isSidebarVisible">
  <app-sidebar></app-sidebar>
  <div class="dash-main">
    <!-- Top Navbar -->
    <div class="dash-topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger-btn" (click)="sidebarService.toggleSidebar()">☰</button>
        <button (click)="goBack()" style="background:#e2e8f0;border:none;padding:0.4rem 0.8rem;border-radius:4px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.25rem;font-size:0.85rem;">
          ← Go Back
        </button>
        <span class="dash-topbar-title">Purchase Orders</span>
      </div>
      <div class="dash-topbar-right">
        <span>🔔 Notifications</span>
        <span class="dash-topbar-user">👤 {{ sidebarService.getCurrentRoleLabel() }}</span>
      </div>
    </div>

    <!-- Create PO Form (Admin / PM only) -->
    <div *ngIf="sidebarService.getCurrentRole() === 'admin' || sidebarService.getCurrentRole() === 'procurement'" style="background:#f1f5f9;padding:1.5rem 2rem;border-bottom:1px solid #cbd5e1;">
      <h3 style="margin-top:0;margin-bottom:1rem;color:#1e293b;font-weight:800;">💰 Create Purchase Order</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr) auto;gap:1rem;align-items:end;">
        <div>
          <label style="display:block;font-size:0.8rem;font-weight:700;color:#475569;margin-bottom:0.25rem;">Vendor Assignment</label>
          <select [(ngModel)]="newVendor" style="width:100%;padding:0.5rem;border:1px solid #cbd5e1;border-radius:4px;background:white;">
            <option value="">Choose Vendor...</option>
            <option *ngFor="let v of vendors" [value]="v">{{v}}</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.8rem;font-weight:700;color:#475569;margin-bottom:0.25rem;">Order Amount (₹)</label>
          <input type="number" [(ngModel)]="newAmount" placeholder="Amount" style="width:100%;padding:0.5rem;border:1px solid #cbd5e1;border-radius:4px;">
        </div>
        <div>
          <label style="display:block;font-size:0.8rem;font-weight:700;color:#475569;margin-bottom:0.25rem;">Expected Delivery (Days)</label>
          <input type="number" [(ngModel)]="deliveryDays" style="width:100%;padding:0.5rem;border:1px solid #cbd5e1;border-radius:4px;">
        </div>
        <button (click)="createOrder()" style="background:#1e3a8a;color:white;border:none;padding:0.6rem 1.2rem;border-radius:4px;font-weight:700;cursor:pointer;height:38px;">
          Issue PO
        </button>
      </div>
    </div>

    <!-- PO List Table -->
    <div style="padding:2rem;">
      <h3 style="margin-top:0;margin-bottom:1rem;color:#1e293b;font-weight:800;">Issued Purchase Orders</h3>
      <table style="width:100%;border-collapse:collapse;box-shadow:0 2px 8px rgba(0,0,0,0.05);border-radius:6px;overflow:hidden;">
        <thead>
          <tr style="background:#1e3a8a;color:white;">
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">PO ID</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Vendor Name</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Amount</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Order Date</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Est. Delivery</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Status</th>
            <th style="padding:1rem;font-weight:700;text-align:center;font-size:0.9rem;border:1px solid #cbd5e1;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let o of orders" style="background:white;border-bottom:1px solid #cbd5e1;">
            <td style="padding:1rem;text-align:center;font-weight:700;color:#1e293b;">{{o.id}}</td>
            <td style="padding:1rem;text-align:center;font-weight:700;color:#1e293b;">{{o.vendorName}}</td>
            <td style="padding:1rem;text-align:center;color:#1e3a8a;font-weight:700;">₹{{o.amount | number}}</td>
            <td style="padding:1rem;text-align:center;color:#475569;font-weight:500;">{{o.orderDate}}</td>
            <td style="padding:1rem;text-align:center;color:#475569;font-weight:500;">{{o.deliveryDate}}</td>
            <td style="padding:1rem;text-align:center;">
              <span [style.background]="o.status === 'Approved' ? '#dcfce7' : o.status === 'Delivered' ? '#cbd5e1' : o.status === 'Completed' ? '#dbeafe' : '#fef9c3'"
                    [style.color]="o.status === 'Approved' ? '#166534' : o.status === 'Delivered' ? '#334155' : o.status === 'Completed' ? '#1e40af' : '#854d0e'"
                    style="padding:0.25rem 0.5rem;border-radius:4px;font-size:0.8rem;font-weight:700;">
                {{o.status}}
              </span>
            </td>
            <td style="padding:1rem;text-align:center;display:flex;justify-content:center;gap:0.5rem;">
              <button *ngIf="o.status === 'Pending' && (sidebarService.getCurrentRole() === 'admin' || sidebarService.getCurrentRole() === 'procurement')" 
                      (click)="updateStatus(o, 'Approved')" style="background:#dcfce7;color:#15803d;border:none;padding:0.3rem 0.6rem;border-radius:4px;font-weight:700;font-size:0.75rem;cursor:pointer;">
                Approve
              </button>
              <button *ngIf="o.status === 'Approved' && (sidebarService.getCurrentRole() === 'admin' || sidebarService.getCurrentRole() === 'supply')" 
                      (click)="updateStatus(o, 'Delivered')" style="background:#cbd5e1;color:#1e293b;border:none;padding:0.3rem 0.6rem;border-radius:4px;font-weight:700;font-size:0.75rem;cursor:pointer;">
                Mark Delivered
              </button>
              <button *ngIf="o.status === 'Delivered' && (sidebarService.getCurrentRole() === 'admin' || sidebarService.getCurrentRole() === 'finance')" 
                      (click)="updateStatus(o, 'Completed')" style="background:#dbeafe;color:#1e40af;border:none;padding:0.3rem 0.6rem;border-radius:4px;font-weight:700;font-size:0.75rem;cursor:pointer;">
                Pay & Close
              </button>
              <button (click)="simulateUpload(o)" style="background:#f3f4f6;color:#374151;border:none;padding:0.3rem 0.6rem;border-radius:4px;font-weight:600;font-size:0.75rem;cursor:pointer;">
                📄 Invoice
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
