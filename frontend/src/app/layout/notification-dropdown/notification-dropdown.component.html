<button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="notifications-bell">
  <mat-icon [matBadge]="unreadCount" matBadgeColor="warn" [matBadgeHidden]="unreadCount === 0">notifications</mat-icon>
</button>

<mat-menu #notificationMenu="matMenu" class="notification-menu">
  <div class="notification-header" (click)="$event.stopPropagation()">
    <span>Notifications ({{unreadCount}})</span>
    <button mat-button color="primary" class="mark-all-btn" (click)="markAllAsRead($event)" *ngIf="unreadCount > 0">
      Mark all read
    </button>
  </div>
  <mat-divider></mat-divider>
  
  <div class="notification-list">
    <div *ngIf="notifications.length === 0" class="no-notifications">
      No notifications found.
    </div>
    
    <div class="notification-item" *ngFor="let n of notifications" [class.unread]="n.status === 'Unread'" (click)="markAsRead(n, $event)">
      <div class="notification-icon" [ngClass]="n.priority.toLowerCase()">
        <mat-icon *ngIf="n.priority === 'High'">error</mat-icon>
        <mat-icon *ngIf="n.priority === 'Medium'">warning</mat-icon>
        <mat-icon *ngIf="n.priority === 'Low'">info</mat-icon>
      </div>
      <div class="notification-content">
        <div class="notification-title">{{n.title}}</div>
        <div class="notification-time">{{n.time | date:'short'}}</div>
      </div>
      <div class="notification-action" *ngIf="n.status === 'Unread'">
        <div class="unread-dot"></div>
      </div>
    </div>
  </div>
  
  <mat-divider></mat-divider>
  <div class="notification-footer">
    <a mat-button color="primary" routerLink="/notifications">View All Notifications</a>
  </div>
</mat-menu>
