<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-title">Vendor Reliability<br>Intelligence Platform</div>
    
    <div class="auth-subtitle">Forgot Password</div>
    
    <div class="auth-desc">
      Don't worry! Enter your registered email<br>address below
    </div>

    <div class="auth-form">
      <div class="field-group">
        <label class="field-label">Registered Email Address</label>
        <input class="field-input" type="email" [(ngModel)]="email" placeholder="Enter your registered email">
      </div>
      
      <button class="btn-primary" (click)="onSend()">Send Reset Link</button>
      
      <div class="remember-block">
        <p class="remember-text">Remember your password?</p>
        <p class="login-link">Back to <a routerLink="/login" class="link-blue">Login</a></p>
      </div>
    </div>
  </div>
</div>
