<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-title">Vendor Reliability<br>Intelligence Platform</div>
    <div class="auth-subtitle">Reset Password</div>
    <div class="auth-form">
      <div class="field-group" style="margin-top:1rem;">
        <label class="field-label">New Password</label>
        <input class="field-input" type="password" [(ngModel)]="newPassword" placeholder="Enter new password">
      </div>
      <div class="field-group">
        <label class="field-label">Confirm Password</label>
        <input class="field-input" type="password" [(ngModel)]="confirmPassword" placeholder="Re-enter new password">
      </div>
      <button class="btn-primary" (click)="onReset()">Save Password</button>
      <p class="login-link">Remember your password? <a routerLink="/login" class="link-blue">Login</a></p>
    </div>
  </div>
</div>
