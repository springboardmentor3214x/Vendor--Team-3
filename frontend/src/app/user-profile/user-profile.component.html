<div class="header-strip">
  Vendor Reliability<br>
  <span style="font-size:0.95rem;font-weight:700;color:#64748b;margin-top:0.25rem;display:inline-block;">Intelligence platform</span>
</div>
<div class="subheader-strip">
  <div style="display:flex;align-items:center;gap:1rem;">
    <button class="hamburger-btn" (click)="sidebarService.toggleSidebar()">☰</button>
    <div class="search-box-container">
      <input type="text" placeholder="Search..." class="search-pill">
    </div>
  </div>
  <div class="topbar-right-info">
    <span class="bell-span" (click)="sidebarService.toggleNotifications()">🔔 Notification</span>
    <span class="user-span">👤 User</span>
  </div>
</div>

<div class="dash-wrapper" [class.sidebar-hidden]="!sidebarService.isSidebarVisible">
  <app-sidebar></app-sidebar>
  <div class="dash-main">
    <div class="dash-content">
      
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar">👤</div>
          <h2>My Profile</h2>
        </div>

        <div class="profile-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" [(ngModel)]="fullName" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" [(ngModel)]="email" class="form-input" readonly>
          </div>
          <div class="form-group">
            <label class="form-label">Moblie Number</label>
            <input type="text" [(ngModel)]="mobile" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <input type="text" [(ngModel)]="role" class="form-input">
          </div>
        </div>

        <div class="profile-actions">
          <button (click)="onSave()" class="btn-edit">Edit profile</button>
          <button class="btn-pwd">Change Password</button>
        </div>
      </div>

    </div>
  </div>
</div>
